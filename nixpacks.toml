[phases.setup]
nixPkgs = [
  "bash",
  "coreutils",
  "curl",
  "nginx",
  "nodejs_22"
  "openssl",
  "php84"
  "php84Packages.composer"
  "wget"
]

[phases.install]
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build"
]